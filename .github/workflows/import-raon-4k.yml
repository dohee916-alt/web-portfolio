name: Import high-resolution Raon pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-raon-4k.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify all six exports
        run: |
          mkdir -p /tmp/raon4k
          curl --fail --location --retry 2 --max-time 90 --silent --show-error 'https://www.figma.com/api/mcp/asset/84cfe561-c6e6-45fe-9f77-405bf1de2ded.jpeg' -o /tmp/raon4k/1.jpg
          test "$(wc -c < /tmp/raon4k/1.jpg)" -eq 4958977
          curl --fail --location --retry 2 --max-time 90 --silent --show-error 'https://www.figma.com/api/mcp/asset/82e29748-5ed7-4e14-bafb-0218ec195599.jpeg' -o /tmp/raon4k/2.jpg
          test "$(wc -c < /tmp/raon4k/2.jpg)" -eq 4848949
          curl --fail --location --retry 2 --max-time 90 --silent --show-error 'https://www.figma.com/api/mcp/asset/c30932a7-b831-4e41-91d4-b97e746d9753.jpeg' -o /tmp/raon4k/3.jpg
          test "$(wc -c < /tmp/raon4k/3.jpg)" -eq 4939337
          curl --fail --location --retry 2 --max-time 90 --silent --show-error 'https://www.figma.com/api/mcp/asset/b97ffd10-3263-4279-9061-5913dec1a5be.jpeg' -o /tmp/raon4k/4.jpg
          test "$(wc -c < /tmp/raon4k/4.jpg)" -eq 6250981
          curl --fail --location --retry 2 --max-time 90 --silent --show-error 'https://www.figma.com/api/mcp/asset/1a514ed3-08e2-4349-a896-3b05d2280f6b.jpeg' -o /tmp/raon4k/5.jpg
          test "$(wc -c < /tmp/raon4k/5.jpg)" -eq 6257175
          curl --fail --location --retry 2 --max-time 90 --silent --show-error 'https://www.figma.com/api/mcp/asset/28d43000-9b28-437f-bbcb-f7c69ea33586.jpeg' -o /tmp/raon4k/6.jpg
          test "$(wc -c < /tmp/raon4k/6.jpg)" -eq 5425296
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('/tmp/raon4k').glob('*.jpg')):
              with Image.open(p) as im:
                  assert im.format == 'JPEG' and im.size == (3840, 2160), (p, im.size)
                  im.load()
              print(p.name, 'verified 3840x2160')
          PY
          mkdir -p assets/raon
          cp /tmp/raon4k/*.jpg assets/raon/
      - name: Commit verified images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raon
          git diff --cached --quiet || git commit -m "Replace Raon portfolio with Figma 4K exports"
          git push origin main
