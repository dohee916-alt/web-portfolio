<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio — Projects</title><link rel="stylesheet" href="./style.css?v=reader1"></head>
<body><header><span>PORTFOLIO</span><button id="fold" type="button" hidden aria-label="처음 화면으로 돌아가기"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 6L7 12L17 18"/></svg></button></header>
<main id="scene" data-phase="intro" aria-label="Interactive portfolio"><div class="heading" hidden aria-hidden="true"><p id="eyebrow">01 / LAYERS</p><h1 id="headline">Layers of experience.</h1><p id="hint">스크롤하여 레이어를 펼치세요.</p></div>
<div id="world"><svg id="curve" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><path d="M 0 350 Q 500 30 1000 350"/></svg><div id="layers"></div></div>
<div id="nav" hidden><button id="prev" aria-label="Previous project">←</button><span id="counter"></span><button id="next" aria-label="Next project">→</button></div></main>
<section id="detail" class="project-reader" aria-label="Project portfolio" aria-hidden="true">
 <div class="reader-scroll" id="readerScroll" tabindex="-1">
  <header class="reader-topbar"><button id="close" type="button" aria-label="프로젝트 목록으로 돌아가기"><span aria-hidden="true">←</span> BACK TO PROJECTS</button><span class="reader-index">PROJECT PORTFOLIO</span></header>
  <div class="reader-heading"><div id="symbolSlot" class="reader-symbol"><img id="projectSymbol" alt="" hidden><span id="symbolPending">PROJECT SYMBOL<br>TO BE ADDED</span></div><p id="category" class="reader-category"></p><h1 id="projectTitle"></h1></div>
  <div id="pdfStatus" class="pdf-status" role="status" aria-live="polite"></div>
  <div id="pdfPages" class="pdf-pages" aria-label="스크롤하여 읽는 프로젝트 PDF 포트폴리오"></div>
 </div>
</section>
<div id="projectPeel" class="project-peel" aria-hidden="true"><div class="peel-shape"><i class="peel-half peel-half-left"></i><i class="peel-half peel-half-right"></i><span class="peel-core"></span></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script><script src="./projects.js?v=hybrid21"></script><script src="./main.js?v=reader2"></script></body></html>
